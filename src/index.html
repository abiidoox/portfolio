  <meta name="theme-color" content="#080b12">

  <!-- Applies the saved theme before first paint. Without this the app boots
       dark and repaints light, which reads as a flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        // The body does not exist yet, so the class goes on <html> and the
        // component keeps <body> in sync once Angular boots.
        document.documentElement.classList.add(theme + '-theme');

        // Also set language from localStorage if available (to prevent FOUC with language)
        var savedLang = localStorage.getItem('language');
        if (savedLang) {
          document.documentElement.lang = savedLang;
        }
      } catch (e) { /* private mode: fall through to the dark default */ }
    })();
  </script>

</head>
<body>
  <app-root></app-root>

  <!-- Netlify: static hidden form so Netlify detects the form at build time.
       Machine-only — the real form posts to this name from the Contact route.
       aria-hidden keeps these duplicate controls out of the accessibility tree. -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden aria-hidden="true">
    <input type="hidden" name="form-name" value="contact">
    <input type="text" name="bot-field" tabindex="-1" autocomplete="off">
    <input type="text" name="name" tabindex="-1">
    <input type="email" name="email" tabindex="-1">
    <textarea name="message" tabindex="-1"></textarea>
  </form>
</body>
