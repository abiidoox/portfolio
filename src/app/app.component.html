<app-terminal-intro></app-terminal-intro>
<app-scroll-progress></app-scroll-progress>
<app-toast-container></app-toast-container>
<div class="noise-overlay" aria-hidden="true"></div>
<div class="mouse-glow" aria-hidden="true"></div>
<app-particles-background></app-particles-background>

<div class="app-container d-flex flex-column min-vh-100">
  <app-header></app-header>
  <main class="main-content container py-4">
    <div class="route-wrap" [@routeAnimations]="prepareRoute(o)">
      <router-outlet #o="outlet"></router-outlet>
    </div>
  </main>
  <app-footer></app-footer>
  <app-back-to-top></app-back-to-top>
</div>

<app-project-modal
  *ngIf="modalProject"
  [project]="modalProject"
  (closeRequest)="closeModal()">
</app-project-modal>
