<section class="lab-section pt-10 sm:pt-14">
  <div class="lab-shell">

    <!-- Back -->
    <a routerLink="/notes"
       class="inline-flex items-center gap-2 font-mono text-[0.7rem] uppercase tracking-[0.18em] text-slate-500
              transition-colors duration-300 hover:text-signal"
       appScrollReveal data-reveal-direction="up">
      <i class="fas fa-arrow-left text-xs" aria-hidden="true"></i>
      <span>{{ 'NOTES.BACK' | translate }}</span>
    </a>

    @if (view(); as note) {
      <header class="mb-12 mt-10 max-w-3xl">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 font-mono text-[0.65rem]
                    uppercase tracking-[0.18em] text-slate-500"
          appScrollReveal data-reveal-direction="up">
          <time [attr.datetime]="note.date">{{ note.dateLabel }}</time>
          <span aria-hidden="true">&middot;</span>
          <span>{{ 'NOTES.READING_TIME' | translate: { minutes: note.readingMinutes } }}</span>
        </div>
        <h1 class="lab-title mt-5" appScrollReveal data-reveal-direction="up" data-delay="100">
          <span class="lab-gradient-text">{{ note.title }}</span>
        </h1>
        <p class="lab-lead mt-5 text-pretty" appScrollReveal data-reveal-direction="up" data-delay="200">
          {{ note.summary }}
        </p>
      </header>

      <article class="max-w-3xl">
        @for (paragraph of note.paragraphs; track $index) {
          <p class="mb-5 text-base leading-relaxed text-slate-300 last:mb-0"
             appScrollReveal data-reveal-direction="up">{{ paragraph }}</p>
        }
      </article>

      <div class="mt-14 border-t border-white/[0.07] pt-8" appScrollReveal data-reveal-direction="up">
        <a routerLink="/notes" class="lab-btn lab-btn-ghost">
          <i class="fas fa-arrow-left text-xs" aria-hidden="true"></i>
          <span>{{ 'NOTES.BACK' | translate }}</span>
        </a>
      </div>
    }

  </div>
</section>
