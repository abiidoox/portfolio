<div class="relative">
  <button type="button"
    id="language-trigger"
    (click)="toggleDropdown()"
    [attr.aria-label]="triggerLabel"
    [attr.aria-expanded]="isDropdownOpen"
    aria-haspopup="true"
    aria-controls="language-menu"
    aria-keyshortcuts="l"
          class="lab-icon-btn grid h-9 w-9 place-items-center rounded-lg border border-white/10 bg-white/[0.03]
                 text-slate-400 hover:border-signal/50 hover:text-signal">
    <i [class]="getCurrentLanguage().icon" class="text-[0.8rem]"></i>
  </button>

  @if (isDropdownOpen) {
    <div
      id="language-menu"
      role="menu"
      aria-labelledby="language-trigger"
       class="lab-dark-panel lab-pop absolute right-0 top-11 z-50 w-44 overflow-hidden rounded-xl border
              border-white/10 p-1.5 shadow-lift backdrop-blur-xl">
      @for (lang of languages; track lang) {
        <button type="button"
          #optionBtn
          (click)="switchLanguage(lang.code)"
          role="menuitemradio"
          [attr.aria-checked]="lang.code === currentLanguage"
          [attr.lang]="lang.code"
            class="lab-menu-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left
                   font-display text-[0.82rem] transition-colors duration-200">
          <i [class]="lang.icon" class="text-[0.7rem]" aria-hidden="true"></i>
          <span>{{ lang.name }}</span>
          @if (lang.code === currentLanguage) {
            <i class="fas fa-check ml-auto text-[0.6rem]" aria-hidden="true"></i>
          }
        </button>
      }
    </div>
  }
</div>
