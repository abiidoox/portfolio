<section class="lab-section pt-10 sm:pt-14">
  <div class="lab-shell">

    <!-- Header -->
    <header class="mb-14 max-w-2xl">
      <span class="lab-kicker" appScrollReveal data-reveal-direction="up">{{ 'NOTES.KICKER' | translate }}</span>
      <h1 class="lab-title mt-5" appScrollReveal data-reveal-direction="up" data-delay="100">
        <span class="lab-gradient-text">{{ 'NOTES.TITLE' | translate }}</span>
      </h1>
      <p class="lab-lead mt-5 text-pretty" appScrollReveal data-reveal-direction="up" data-delay="200">
        {{ 'NOTES.SUBTITLE' | translate }}
      </p>
    </header>

    <!-- Notes, newest first -->
    <div class="space-y-4">
      @for (note of notes(); track note.slug; let i = $index) {
        <a
          [routerLink]="['/notes', note.slug]"
          class="lab-panel group block rounded-3xl p-6 transition-[transform,border-color] duration-300
                 hover:-translate-y-0.5 hover:border-signal/40 sm:p-7"
          appScrollReveal data-reveal-direction="up" [attr.data-delay]="i * 80">
          <div class="flex items-start justify-between gap-6">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 font-mono text-[0.65rem]
                          uppercase tracking-[0.18em] text-slate-500">
                <time [attr.datetime]="note.date">{{ note.dateLabel }}</time>
                <span aria-hidden="true">&middot;</span>
                <span>{{ 'NOTES.READING_TIME' | translate: { minutes: note.readingMinutes } }}</span>
              </div>
              <h2 class="mt-3 font-display text-lg font-semibold text-white transition-colors duration-300
                         group-hover:text-signal-soft sm:text-xl">
                {{ note.title }}
              </h2>
              <p class="mt-2 max-w-2xl text-sm leading-relaxed text-slate-400">{{ note.summary }}</p>
            </div>
            <i class="fas fa-arrow-right mt-1 shrink-0 text-xs text-slate-600 transition-all duration-300
                      group-hover:translate-x-1 group-hover:text-signal" aria-hidden="true"></i>
          </div>
        </a>
      }
    </div>

  </div>
</section>
