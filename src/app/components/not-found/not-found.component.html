<section class="lab-section grid min-h-[70vh] place-items-center py-20 text-center">
  <div class="w-full max-w-lg">

    <!-- 404 readout: decorative, the message below carries the meaning -->
    <div class="mb-8 flex items-end justify-center gap-1.5" aria-hidden="true">
      <span class="font-mono text-7xl font-bold leading-none text-slate-300 sm:text-8xl">4</span>
      <span class="relative grid h-20 w-20 place-items-center sm:h-24 sm:w-24">
        <!-- Static ring — decorative, never spins. -->
        <span class="lab-ring-static absolute inset-0 rounded-full border-2 border-signal/30"></span>
        <span class="font-mono text-6xl font-bold leading-none text-signal sm:text-7xl">0</span>
      </span>
      <span class="font-mono text-7xl font-bold leading-none text-slate-300 sm:text-8xl">4</span>
    </div>

    <h1 class="font-display text-2xl font-semibold text-balance sm:text-3xl">
      {{ 'NOT_FOUND.TITLE' | translate }}
    </h1>
    <p class="lab-lead mt-4 text-pretty">
      {{ 'NOT_FOUND.MESSAGE' | translate }}
    </p>

    <div class="mt-10 flex flex-wrap items-center justify-center gap-3">
      <button type="button" (click)="goHome()" class="lab-btn lab-btn-primary">
        <i class="fas fa-arrow-left text-xs"></i>
        <span>{{ 'NOT_FOUND.BACK_HOME' | translate }}</span>
      </button>
      <a routerLink="/projects" class="lab-btn lab-btn-ghost">
        <i class="fas fa-diagram-project text-xs"></i>
        <span>{{ 'header.projects' | translate }}</span>
      </a>
    </div>

    <!-- Shell. Keyboard-first, no animation: emil's rule for commands that
         repeat. Every command does real work. -->
    <div class="lab-panel mx-auto mt-14 w-full max-w-xl overflow-hidden rounded-2xl text-left">
      <div class="flex items-center gap-2 border-b border-white/[0.06] px-5 py-3">
        <span class="h-2.5 w-2.5 rounded-full bg-[#ff5f57]"></span>
        <span class="h-2.5 w-2.5 rounded-full bg-[#febc2e]"></span>
        <span class="h-2.5 w-2.5 rounded-full bg-[#28c840]"></span>
        <span class="ml-2 font-mono text-[0.62rem] uppercase tracking-[0.16em] text-slate-600">
          {{ 'NOT_FOUND.CMD.PANEL' | translate }}
        </span>
      </div>

      <div class="h-44 space-y-1.5 overflow-y-auto px-5 py-4 font-mono text-[0.78rem] leading-relaxed"
           role="log"
           aria-live="polite">
        @for (line of lines(); track $index) {
          <p [class]="line.kind === 'err' ? 'text-signal' : 'text-slate-300'">
            @if (line.kind === 'cmd') {
              <span class="mr-2 text-mint">$</span>
            }
            {{ line.text }}
          </p>
        }
      </div>

      <form (ngSubmit)="run()" class="flex items-center gap-2.5 border-t border-white/[0.06] px-5 py-3.5">
        <span class="font-mono text-[0.8rem] text-mint" aria-hidden="true">$</span>
        <input
          #cmdInput
          type="text"
          name="command"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          [(ngModel)]="command"
          [attr.aria-label]="'NOT_FOUND.CMD.INPUT_LABEL' | translate"
          placeholder="help"
          class="flex-1 bg-transparent font-mono text-[0.8rem] text-slate-200 outline-none
                 placeholder:text-slate-600">
      </form>
    </div>
  </div>
</section>
