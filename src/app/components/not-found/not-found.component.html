<div class="not-found-container">
  <div class="not-found-content">
    <div class="error-code" aria-label="404">
      <span class="number glitch" data-text="4">4</span>
      <span class="zero glitch" data-text="0">0</span>
      <span class="number glitch" data-text="4">4</span>
    </div>
    <h1 class="error-title">{{ 'NOT_FOUND.TITLE' | translate }}</h1>
    <p class="error-message">{{ 'NOT_FOUND.MESSAGE' | translate }}</p>
    <button class="home-button" (click)="goHome()">
      <span class="button-text">{{ 'NOT_FOUND.BACK_HOME' | translate }}</span>
      <span class="button-icon">→</span>
    </button>
  </div>
</div>
