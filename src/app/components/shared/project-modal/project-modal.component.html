<div class="fixed inset-0 z-[2000] overflow-y-auto overscroll-contain p-4 sm:p-6">
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-ink-950/85 backdrop-blur-md animate-fade-in"
    (click)="close()"
    aria-hidden="true"
  ></div>

  <!-- Dialog -->
  <div class="relative z-10 mx-auto flex min-h-full w-full max-w-3xl items-center justify-center">
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="pm-title"
      class="lab-panel w-full animate-scale-in overflow-hidden rounded-3xl"
    >
      <!-- Visual band -->
      <div class="relative h-32 overflow-hidden border-b border-white/[0.06] sm:h-40">
        <div class="lab-grid-bg absolute inset-0 opacity-40"></div>
        <div class="absolute inset-0 bg-gradient-to-br" [ngClass]="gradientFor(project?.category || '')"></div>
        <div class="absolute inset-0 grid place-items-center">
          <i class="fas text-5xl text-white/[0.14] sm:text-6xl"
             [ngClass]="categoryIcon(project?.category || '')"></i>
        </div>

        <button type="button" (click)="close()"
                class="pm-close absolute right-4 top-4 z-20 grid h-10 w-10 place-items-center
                       rounded-full border border-white/15 bg-black/30 text-slate-200 backdrop-blur-sm
                       transition-all duration-300 hover:rotate-90 hover:border-signal hover:bg-signal hover:text-white"
                [attr.aria-label]="'A11Y.MODAL_CLOSE' | translate">
          <i class="fas fa-xmark"></i>
        </button>
      </div>

      <!-- Body -->
      <div class="max-h-[60vh] overflow-y-auto p-6 sm:p-8">
        <div class="flex flex-wrap items-center gap-3">
          <span class="rounded-full border border-white/12 bg-white/[0.04] px-3 py-1
                       font-mono text-[0.62rem] uppercase tracking-[0.14em] text-slate-300">
            {{ getCategoryLabel() }}
          </span>
          <span *ngIf="project?.date" class="font-mono text-[0.68rem] text-slate-500">
            {{ project?.date }}
          </span>
          <span *ngIf="project?.featured"
                class="rounded-full border border-signal/30 bg-signal/10 px-2.5 py-1
                       font-mono text-[0.6rem] uppercase tracking-[0.12em] text-signal-soft">
            {{ 'PROJECTS.FEATURED' | translate }}
          </span>
        </div>

        <h2 id="pm-title" class="mt-4 font-display text-2xl font-semibold leading-snug text-balance sm:text-3xl">
          {{ project?.title }}
        </h2>

        <p class="mt-5 text-[0.95rem] leading-relaxed text-slate-400 text-pretty">
          {{ project?.longDescription || project?.description }}
        </p>

        <!-- Technologies -->
        <div *ngIf="project?.technologies?.length" class="mt-8">
          <h3 class="mb-3.5 font-mono text-[0.66rem] uppercase tracking-[0.2em] text-slate-500">
            {{ 'PROJECTS.TECHNOLOGIES' | translate }}
          </h3>
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let tech of project?.technologies" class="lab-tag">{{ tech }}</span>
          </div>
        </div>

        <!-- Links -->
        <div *ngIf="project?.links?.length" class="mt-8 flex flex-wrap gap-3 border-t border-white/[0.07] pt-6">
          <a *ngFor="let link of project?.links"
             [href]="link.url" target="_blank" rel="noopener noreferrer"
             class="lab-btn lab-btn-ghost !px-5 !py-2.5 !text-[0.82rem]">
            <i [class]="link.icon"></i>
            <span>{{ link.labelKey | translate }}</span>
            <i class="fas fa-arrow-up-right-from-square text-[0.65rem] opacity-60"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
