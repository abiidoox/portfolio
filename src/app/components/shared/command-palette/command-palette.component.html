@if (palette.isOpen()) {
  <div class="fixed inset-0 z-[3000]">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-ink-950/70 backdrop-blur-sm"
         (click)="close()"
         aria-hidden="true"></div>

    <!-- Panel: anchored near the top, where the eye already is -->
    <div class="relative mx-auto mt-[12vh] w-[min(92vw,40rem)]">
      <div role="dialog"
           aria-modal="true"
           [attr.aria-label]="'PALETTE.OPEN_LABEL' | translate"
           class="lab-panel overflow-hidden rounded-2xl shadow-2xl">

        <!-- Search -->
        <div class="flex items-center gap-3 border-b border-white/[0.07] px-5">
          <i class="fas fa-magnifying-glass text-sm text-slate-500" aria-hidden="true"></i>
          <input
            #paletteInput
            type="text"
            role="combobox"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-controls="palette-list"
            [attr.aria-expanded]="true"
            [attr.aria-activedescendant]="activeId() || null"
            [value]="query()"
            (input)="onQueryInput($event)"
            (keydown)="onInputKeydown($event)"
            [attr.placeholder]="'PALETTE.PLACEHOLDER' | translate"
            class="h-14 flex-1 bg-transparent text-[0.95rem] text-slate-200 outline-none
                   placeholder:text-slate-500">
          <kbd class="rounded-md border border-white/10 bg-white/[0.04] px-2 py-1
                      font-mono text-[0.6rem] text-slate-500">esc</kbd>
        </div>

        <!-- Results -->
        <div id="palette-list" role="listbox" class="max-h-[50vh] overflow-y-auto py-2">
          @if (isEmpty()) {
            <p class="px-5 py-10 text-center text-sm text-slate-500">
              {{ 'PALETTE.NO_RESULTS' | translate: { query: query() } }}
            </p>
          }

          @for (row of rows(); track $index) {
            @if (row.header) {
              <p class="px-5 pb-1 pt-3 font-mono text-[0.6rem] uppercase tracking-[0.2em] text-slate-600">
                {{ row.header }}
              </p>
            } @else if (row.item) {
              <button
                type="button"
                [id]="row.item.id"
                role="option"
                [attr.aria-selected]="row.index === activeIndex()"
                (click)="run(row.item)"
                (mouseenter)="setActive(row.index)"
                class="flex w-full items-center gap-3.5 px-5 py-2.5 text-left transition-colors duration-75"
                [class]="row.index === activeIndex() ? 'bg-white/[0.06]' : ''">
                <i [class]="row.item.icon"
                   class="w-4 text-center text-sm"
                   [class.text-signal]="row.index === activeIndex()"
                   [class.text-slate-500]="row.index !== activeIndex()"
                   aria-hidden="true"></i>
                <span class="min-w-0 flex-1 truncate text-sm"
                      [class.text-white]="row.index === activeIndex()"
                      [class.text-slate-300]="row.index !== activeIndex()">
                  {{ row.item.label }}
                </span>
                @if (row.item.hint) {
                  <span class="shrink-0 font-mono text-[0.65rem] text-slate-600">{{ row.item.hint }}</span>
                }
              </button>
            }
          }
        </div>

        <!-- Footer hint -->
        <div class="border-t border-white/[0.06] px-5 py-2.5 text-center
                    font-mono text-[0.62rem] text-slate-600">
          {{ 'PALETTE.HINTS' | translate }}
        </div>
      </div>
    </div>
  </div>
}
