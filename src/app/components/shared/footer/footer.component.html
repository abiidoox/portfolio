<footer class="relative mt-8 border-t border-white/[0.07]">
  <div class="lab-shell py-12 sm:py-14">

    <div class="grid gap-10 md:grid-cols-[auto_1fr_auto] md:items-center md:gap-8">

      <!-- Monogram -->
      <a routerLink="/" class="group inline-flex items-center gap-3 self-start" [attr.aria-label]="'A11Y.NAV_HOME' | translate">
        <span class="grid h-11 w-11 place-items-center rounded-xl bg-signal-sweep-deep font-display
                     text-base font-bold text-white shadow-signal-glow transition-transform
                     duration-500 ease-swift group-hover:scale-105">
          AE
        </span>
        <span class="hidden sm:block">
          <span class="block font-display text-sm font-semibold text-slate-200">Abderrazzaq El Abdouni</span>
          <span class="mt-0.5 block font-mono text-[0.64rem] uppercase tracking-[0.16em] text-slate-600">
            {{ 'ABOUT.ROLE' | translate }}
          </span>
        </span>
      </a>

      <!-- Nav. py-1.5 keeps every link at or above the 24px WCAG 2.2 target
           minimum; the text alone measured 20px tall. -->
      <nav class="-mx-2 flex flex-wrap gap-x-4 gap-y-1 md:justify-center" [attr.aria-label]="'A11Y.FOOTER' | translate">
        <a *ngFor="let item of navItems"
           [routerLink]="item.route"
           routerLinkActive="text-signal"
           [routerLinkActiveOptions]="{ exact: item.route === '/' }"
           class="rounded-lg px-2 py-1.5 font-display text-sm text-slate-400 transition-colors
                  duration-300 hover:bg-white/[0.05] hover:text-slate-100">
          {{ item.label | translate }}
        </a>
      </nav>

      <!-- Socials -->
      <div class="flex gap-2.5 md:justify-end">
        <a *ngFor="let link of socialLinks"
           [href]="link.url"
           target="_blank"
           rel="noopener noreferrer"
           [attr.aria-label]="link.label"
           class="grid h-10 w-10 place-items-center rounded-xl border border-white/10 bg-white/[0.03]
                  text-slate-400 transition-all duration-300 hover:-translate-y-1 hover:border-signal/50
                  hover:bg-signal/10 hover:text-signal">
          <i [class]="link.icon"></i>
        </a>
      </div>
    </div>

    <!-- Divider + legal -->
    <div class="mt-10 flex flex-col gap-4 border-t border-white/[0.06] pt-7 sm:flex-row
                sm:items-center sm:justify-between">
      <p class="font-mono text-[0.7rem] text-slate-600">
        {{ 'FOOTER.COPYRIGHT' | translate: { year: currentYear } }}
      </p>

      <button type="button" (click)="copyEmail()"
              [attr.aria-label]="'FOOTER.COPY_HINT' | translate"
              class="group -mx-2 inline-flex items-center gap-2 self-start rounded-lg px-2 py-1.5
                     font-mono text-[0.72rem] text-slate-500 transition-colors duration-300
                     hover:bg-white/[0.05] hover:text-signal sm:self-auto">
        <span>elabdouni.abderrazzaq&#64;gmail.com</span>
        <i class="fas fa-copy text-[0.68rem] transition-transform duration-300 group-hover:scale-110"></i>
      </button>
    </div>
  </div>
</footer>
